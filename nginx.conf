server {
  listen 80;
  listen [::]:80;
  server_name _;

  root /usr/share/nginx/html;
  index index.html;

  # The app emits only relative URLs, so it works served from this root both
  # directly (docker run) and under a prefix that a reverse proxy strips before
  # forwarding — which is how production serves it at /currency/. Nothing here
  # rewrites paths; these blocks only set caching.

  # Vite's build output: every filename carries a content hash.
  location /assets/ {
    add_header Cache-Control "public, max-age=31536000, immutable";
  }

  # Favicons and the mask icon, copied verbatim from public/ without a hash.
  # They change roughly never, and the service worker revalidates them by
  # revision anyway.
  location /icons/ {
    add_header Cache-Control "public, max-age=604800";
  }

  # These decide which build a client ends up on, so they must never come from
  # a stale HTTP cache. workbox-<hash>.js is content-hashed but sits at the
  # root, next to sw.js.
  location = / {
    add_header Cache-Control "no-cache";
  }

  location = /index.html {
    add_header Cache-Control "no-cache";
  }

  location = /sw.js {
    add_header Cache-Control "no-cache";
  }

  location = /manifest.json {
    add_header Cache-Control "no-cache";
  }

  location ~ "^/workbox-[0-9a-f]+\.js$" {
    add_header Cache-Control "public, max-age=31536000, immutable";
  }
}
