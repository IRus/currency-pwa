<body>
  <div class="backdrop" aria-hidden="true">
    <span class="backdrop__bloom backdrop__bloom--a"></span>
    <span class="backdrop__bloom backdrop__bloom--b"></span>
    <span class="backdrop__bloom backdrop__bloom--c"></span>
  </div>

  <div id="root"></div>
  <script type="module" src="/src/index.tsx"></script>

  <script>
    // Check compatibility for the browser we're running this in
    if ("serviceWorker" in navigator) {
      // A controller already present means an older worker is driving this page.
      // The new worker calls skipWaiting(), so once it takes over we reload to
      // run the code it just precached. Without the flag the very first install
      // would also reload, since claiming an uncontrolled page fires this too.
      var hadController = Boolean(navigator.serviceWorker.controller);
      var reloading = false;

      navigator.serviceWorker.addEventListener("controllerchange", function () {
        if (!hadController || reloading) return;
        reloading = true;
        window.location.reload();
      });

      navigator.serviceWorker
        .register("sw.js")
        .then(function (reg) {
          console.log("[PWA] Service worker registered for scope: " + reg.scope);
        })
        .catch(function (error) {
          console.error("[PWA] Failed to register service worker: " + error);
        });
    }
  </script>
